<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Learner</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(ellipse at 20% 0%, #d8e8f4 0%, transparent 55%),
        radial-gradient(ellipse at 90% 100%, #f0e2c8 0%, transparent 50%),
        #f7f4ef;
      color: #1c2430;
    }
    main { text-align: center; padding: 2rem; max-width: 28rem; }
    h1 { font-size: clamp(2.4rem, 6vw, 3.4rem); font-weight: 600; letter-spacing: 0.02em; margin: 0 0 0.6rem; }
    p { margin: 0 0 1.25rem; font-size: 1.05rem; line-height: 1.45; opacity: 0.78; }
    a {
      color: #1c2430;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Star Learner</h1>
    <p>Hub origin for Voice-to-Writing. Phones talk to <code>/api/asr</code>.</p>
    <p><a href="/ops/">ops / fogona queue</a> · <a href="/logs/">ASR logs</a></p>
  </main>
</body>
</html>
