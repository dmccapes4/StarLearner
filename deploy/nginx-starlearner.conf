# starlearner.dylanmccapes.systems — Star Learner hub (ASR + landing + logs).
#
# Install via:  sudo bash deploy/deploy.sh
#
# Topology (same as sacred / lineguard):
#   phone → Cloudflare (Full strict) → nginx :443
#     /              → /var/www/starlearner/index.html
#     /api/asr/*     → 127.0.0.1:8770  (systemd user: starlearner-asr)
#     /logs/*        → 127.0.0.1:8771  (systemd user: starlearner-logs)
#                      basic auth = /etc/nginx/nakatomi.htpasswd
#
# Bearer gate: /etc/nginx/conf.d/starlearner-asr-tokens.conf ($asr_token_ok).
# TLS = Cloudflare Origin CA (*.dylanmccapes.systems). DNS A for `starlearner`
# must be Proxied (orange cloud).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name starlearner.dylanmccapes.systems;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    root /var/www/starlearner;
    index index.html;

    # Voice clips are wav multipart; keep headroom past Cloudflare's soft limits.
    client_max_body_size 32m;

    location = /api/asr {
        return 308 /api/asr/;
    }

    # Strip /api/asr so upstream sees /health, /v1/voice_write, …
    location /api/asr/ {
        if ($asr_token_ok = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8770/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location = /ops {
        return 308 /ops/;
    }

    location /ops/ {
        auth_basic           "starlearner";
        auth_basic_user_file /etc/nginx/nakatomi.htpasswd;

        proxy_pass http://127.0.0.1:8771/ops/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $remote_user;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /logs {
        return 308 /logs/;
    }

    # Ops log portal — same htpasswd as nakatomi / lineguard / sacred siblings.
    location /logs/ {
        auth_basic           "starlearner";
        auth_basic_user_file /etc/nginx/nakatomi.htpasswd;

        proxy_pass http://127.0.0.1:8771/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $remote_user;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "public, max-age=60";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name starlearner.dylanmccapes.systems;
    return 301 https://$host$request_uri;
}
