plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dylan.star_learner'
    compileSdk 36

    defaultConfig {
        applicationId "com.dylan.star_learner"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.4-star-learner"
    }

    signingConfigs {
        debugants {
            storeFile file("${System.getenv('HOME')}/moto_fogona_backup/ants-debug.keystore")
            storePassword 'antsdebug'
            keyAlias 'ants'
            keyPassword 'antsdebug'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debugants
        }
        debug {
            signingConfig signingConfigs.debugants
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No AndroidX deps — plain Activity keeps the APK tiny and build simple.
}
